name: Create and publish a Docker image

on:
  push:
      branches:
        - master
  workflow_dispatch:


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # 构建缓存需要 buildx（默认 docker driver 不支持 cache-to）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # 保留 metadata-action 生成的 tags，并额外添加两个每次唯一的 tag：
          # 1) commit SHA (完整 SHA，可改为短 SHA 如果需要)
          # 2) run-id（确保每次 workflow 运行都有唯一 tag）
          tags: ${{ steps.meta.outputs.tags }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:run-${{ github.run_id }}
          labels: ${{ steps.meta.outputs.labels }}
          # 复用 GitHub Actions 缓存（跨运行层缓存 + 最终镜像缓存）
          cache-from: type=gha
          cache-to: type=gha,mode=max
