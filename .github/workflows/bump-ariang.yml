name: Bump AriaNg

# AriaNg is pinned in the Dockerfile through `ARG ARIANG_VERSION`, which Dependabot
# does not track (it only updates the first FROM and ignores ARG/multi-stage builds).
# This workflow keeps that ARG up to date: monthly, plus on demand.
#
# Requires Settings > Actions > General > Workflow permissions:
# "Allow GitHub Actions to create and approve pull requests" (otherwise `gh pr create` fails).

on:
  schedule:
    # 1st of every month, 04:00 UTC = 12:00 Asia/Shanghai
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-ariang
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve current and latest AriaNg version
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          latest="$(gh api repos/mayswind/AriaNg/releases/latest --jq '.tag_name' | sed 's/^v//')"
          current="$(sed -nE 's/^ARG ARIANG_VERSION=(.*)$/\1/p' Dockerfile | head -n1)"

          if [ -z "$latest" ] || [ -z "$current" ]; then
            echo "::error::could not resolve versions (latest='${latest}' current='${current}')"
            exit 1
          fi

          # The Dockerfile downloads exactly AriaNg-<version>.zip, so make sure that asset exists
          if ! gh api repos/mayswind/AriaNg/releases/latest --jq '.assets[].name' \
              | grep -qx "AriaNg-${latest}.zip"; then
            echo "::error::release ${latest} has no AriaNg-${latest}.zip asset"
            exit 1
          fi

          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "AriaNg is already at ${current}"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "AriaNg ${current} -> ${latest}"
          fi

      - name: Update ARG and open pull request
        if: steps.v.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.v.outputs.current }}
          LATEST: ${{ steps.v.outputs.latest }}
        run: |
          set -euo pipefail

          branch="ci/bump-ariang-${LATEST}"

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "pull request for ${branch} already open, nothing to do"
            exit 0
          fi

          sed -i -E "s/^ARG ARIANG_VERSION=.*$/ARG ARIANG_VERSION=${LATEST}/" Dockerfile

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Dockerfile
          git commit -m "build: bump AriaNg to ${LATEST}"
          git push -u origin "$branch"

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "build: bump AriaNg to ${LATEST}" \
            --body "Bumps the bundled [AriaNg](https://github.com/mayswind/AriaNg) web UI from \`${CURRENT}\` to \`${LATEST}\` by updating \`ARG ARIANG_VERSION\` in \`Dockerfile\`.

          Release notes: https://github.com/mayswind/AriaNg/releases/tag/${LATEST}

          Opened automatically by \`.github/workflows/bump-ariang.yml\`."
